spring.application.name=QueueRoom

# MongoDB (Spring Boot 4 uses spring.mongodb, not spring.data.mongodb)
spring.mongodb.uri=mongodb://localhost:27017/waiting_room_db

# Redis (default port, so this is optional but clear)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka (we will use this from Phase 4)
spring.kafka.bootstrap-servers=localhost:9092